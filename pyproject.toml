[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
